<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      安全加固 P2（specs/electron-hardening.md §3b）：辅助窗 CSP，是主窗 index.html CSP 的已验证子集。
      - script-src/style-src 同主窗：module script 走 vite chunk（'self'，打包态 file:），'unsafe-inline'
        覆盖 dev 态 Vite/React-refresh 内联脚本与本文件内联 <style>；
      - connect-src 收紧为 'self' ws: wss:：本窗只经 window.resourceManager IPC bridge 取数（非网络、
        不受 CSP 约束），无 fetch/XHR/WebSocket；ws: 仅供 dev HMR。不保留 http/https（无远端取数面）；
      - 无 frame-src（无 <webview>）、无 media-src/acode-media:（不做音视频预览）；
      - object-src/base-uri/form-action 'none' 封死插件、基址劫持、表单外送。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file: 'unsafe-inline'; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob:; font-src 'self' file: data:; connect-src 'self' ws: wss:; worker-src 'self' file: blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Resource Manager</title>
    <style>
      html,
      body {
        padding: 0;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/resource-manager.tsx"></script>
  </body>
</html>
