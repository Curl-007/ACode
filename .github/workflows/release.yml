name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号：0.0.1（勾选预发布=自动生成 0.0.1-audit.<当天日期>，同日重复构建自动加 .2/.3；不勾选=正式版 v0.0.1）；也可直接填完整日期形式 0.0.1-audit.20260922[.2]"
        required: true
        type: string
      prerelease:
        description: "预发布（audit 日期式版本）；不勾选则发布正式版（干净版本号，成为 GitHub Latest）"
        required: false
        type: boolean
        default: false
      build_artifacts:
        description: "构建 CLI 发行包和桌面客户端并上传到 Release；全部上传成功后才发布（失败则保持 draft）"
        required: false
        type: boolean
        default: true
      keep_draft:
        description: "保持 draft 不公开（用于上游审计自动构建的测试版本；勾选后即使全部成功也不发布）"
        required: false
        type: boolean
        default: false
      notice:
        description: "插入 Release 说明顶部的警示文本（可选，支持多行；用于测试版提示）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 发布级验证门禁（2026-10-05 深度审查后新增）：typecheck / lint / 架构检查 / 全量测试
  # 全绿才允许打 tag 与出包，杜绝「提交信息宣称全绿但发布产物未验证」的情况。
  # 与 .github/workflows/ci.yml 的 verify 保持同一组步骤；此处独立成 job 是因为
  # workflow_dispatch 触发的发布不经过 push/PR 的 CI。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 单一类型门禁入口 scripts/typecheck-gate.mjs：packages（tsc -b）先行，
      # desktop-renderer 与 cli（turbo，含 @acode/cli 自身入口）在其后并行。
      # 规则与验收见 docs/specs/cli-validation-gates.md 第 3-6 条。
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Architecture check
        run: pnpm architecture:check

      - name: Knip (files & dependencies gate)
        run: pnpm knip:gate

      # 与 ci.yml 同因：Tests 经 tsx 引 apps/acode-cli 源码，源码按包名解析兄弟包 dist/，
      # 干净检出没有 dist 会 ERR_MODULE_NOT_FOUND（2026-10-07 release/0.0.4 实测）。
      # 类型门禁的 cli 阶段已经经 turbo ^build 产出这些 dist，此步骤保留是为了让 Tests
      # 的前置不依赖门禁内部阶段顺序；缓存命中时几乎无成本。
      - name: Build CLI workspace packages
        run: npx turbo --skip-infer --cwd apps/acode-cli run build --filter='!@acode/cli'

      # CLI 各包再经自己的就近配置执行 lint，发布验证与根扫描同时有效。
      - name: Lint CLI workspace
        run: pnpm exec turbo --cwd apps/acode-cli run lint

      - name: Tests (all packages)
        run: pnpm test

  # Desktop 启动链路 smoke（docs/specs/ci-platform-matrix.md R2；根因 review 测试专项 R1-04）：
  # e2e-smoke.mjs（CP1 进程存活 / CP2 CDP / CP3 首窗 / CP4 Host fork + 进程树/临时目录清理）此前
  # 仅手工/Windows 本地跑，不进任何 workflow。这里作为**发布门禁**跑一次：构建 dev 态桌面 out/
  # 后启动隔离 Electron，任一检查点失败 → 非零退出 → publish 不执行 → release 保持 draft。
  #
  # 选 windows-latest 而非 Linux：smoke 进程树清理用 taskkill /T /F（Windows 原生路径），历史验收
  # 亦以 Windows isolated-profile 为准；Linux 需 xvfb-run 提供虚拟显示，可靠性未知，不采用。
  # 不放 ci.yml：需 GUI + 完整桌面构建（agent bundle + tsup + vite，分钟级），进主门禁成本过高
  # （spec R2 规则 10 的分工结论）。不设 continue-on-error：smoke 失败必须阻断发布。
  # Node 钉 24.14.0（对齐 mise.toml）；不加 actions/cache（warm-cache 只生产 Linux 条目）。
  desktop-smoke:
    name: Desktop e2e smoke (Electron launch chain)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      # 完整类型门禁：packages 阶段的 tsc -b 产出工程引用声明，桌面 build 与 agent bundle 都消费它
      # （与 build/desktop job 同因）。typecheck run 逐字 pnpm typecheck（cli-validation-gates 规则 5）。
      - name: Typecheck all entries (builds project references)
        shell: bash
        run: pnpm typecheck

      # 构建 dev 态桌面 out/：build = prepare:runtime-assets（含 prepare:agent-bundle，自建 acode.cjs）
      # + tsup + vite。smoke 启动的 main 入口是 out/main/index.js，CP4 fork 的 Host 也来自 out/。
      - name: Build desktop app
        shell: bash
        run: pnpm --filter @acode/desktop build

      # smoke 失败经 process.exit(code) 传非零 → 本 step 红 → desktop-smoke 红 → publish 阻断。
      - name: Electron e2e smoke
        shell: bash
        run: pnpm --filter @acode/desktop e2e:smoke

  release:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          # 版本命名：
          #   0.0.1 + 勾选预发布 -> 0.0.1-audit.<YYYYMMDD>（同一天重复构建自动追加 .2/.3/...）
          #   0.0.1 + 不勾选     -> v0.0.1（正式版，成为 GitHub Latest，/releases/latest 可用）
          #   完整日期形式         -> 严格按给定版本使用，不自动递增
          DATE="$(date -u +%Y%m%d)"
          if printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' && [ "$PRERELEASE" != "true" ]; then
            TAG="v$VERSION"
            if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
              echo "::error::Tag $TAG already exists"
              exit 1
            fi
          elif printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            BASE="$VERSION-audit.$DATE"
            TAG="v$BASE"
            if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
              SEQ=2
              while git ls-remote --tags origin "refs/tags/v$BASE.$SEQ" | grep -q .; do
                SEQ=$((SEQ + 1))
              done
              TAG="v$BASE.$SEQ"
            fi
          elif printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-audit\.[0-9]{8}(\.[0-9]+)?$'; then
            TAG="v$VERSION"
            if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
              echo "::error::Tag $TAG already exists; pass the base version (e.g. 0.0.1) to auto-sequence, or pick another date/suffix"
              exit 1
            fi
          else
            echo "::error::Invalid version \"$VERSION\". Use 0.0.1 (pre-release: date and same-day sequence are appended; stable: v0.0.1) or the full form 0.0.1-audit.20260922[.2]"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # 桌面构建用完整版本（不带 v 前缀）注入 ACODE_APP_VERSION，让安装包文件名带审计序号。
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # tag 在构建前就推送，但 release 先建为 draft：
      # 官网/下载页只解析已发布且带产物列表的 release，draft 不会露出，
      # 避免用户在构建过程中下到某个尚未上传完成的平台产物（404）。
      - name: Create tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.validate.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          NOTICE: ${{ inputs.notice }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          # 说明模板中「installers are not signed by ACode」对应未签名现状（三态 none）；
          # 一旦仓库配置齐全签名 secrets（三态 full），必须在同一次变更中改写这些表述与
          # Gatekeeper/SmartScreen 放行指引（specs/release-signing-smoke.md §5 验收项）。
          cat > /tmp/release-notes.md <<'NOTES'
          # ACode <VERSION>

          ## English

          ### What changed vs ACode

          - **All monitoring and telemetry removed** (~26k lines): ARMS RUM, OTLP reporting, crash collection, resource and network sampling, UI analytics - with regression checks so they cannot be reintroduced.
          - **Official platform services disconnected**: account login, feedback upload, coding plans, official MCP credentials, plugin marketplace and remote client config are short-circuited before any request; feedback points to GitHub Issues.
          - **No account system**: no login, no account concepts. Configure your own API key or a custom model provider and start working.
          - **No purchase or upgrade prompts**: the purchase UI and related copy are removed; nothing pushes you to buy a plan.
          - **No repository upload behavior**: snapshot packaging and upload logic removed, with guards against reintroduction.
          - **Open source and reviewable**: first-party code MIT, upstream Apache-2.0; removal reports for desktop, CLI and UI ship in the repository.
          - **Transparent builds**: installers are built by GitHub Actions from this repository, and in-app updates point to this repository's GitHub Releases.
          - **Honest limitations**: Computer Use is an unavailable placeholder; installers are not signed by ACode.

          ### Install

          - **macOS (.dmg)**: download `ACode-<VERSION>-mac-arm64.dmg` (Apple Silicon) or `ACode-<VERSION>-mac-x64.dmg` (Intel), open it, drag ACode into Applications. The app is not signed by ACode, so Gatekeeper blocks the first launch - this system block is macOS only. Allow it once with the command below (enter your login password when asked; nothing is shown while typing; the command launches the app and exits immediately):

            ```bash
            sudo /usr/bin/xattr -rd com.apple.quarantine "/Applications/ACode.app" && open -a "ACode"
            ```

            The absolute `/usr/bin/xattr` path avoids shadowing by other tools with the same name. You can also right-click (Control-click) the app in Finder -> Open -> Open.
          - **Windows (.exe)**: run `ACode-<VERSION>-win-x64.exe`. The installer is not signed by ACode, so SmartScreen shows a warning - a warning, not a system block; click **More info** -> **Run anyway**. This is expected, not a corrupted file.
          - **Windows portable (.zip)**: extract `ACode-<VERSION>-win-x64.zip` and run `ACode.exe` inside - no installer, no registry/Start-Menu writes. Same unsigned SmartScreen note applies. Note: it is "install-free" (no installer run), not fully self-contained - user data still lives in `%APPDATA%\ACode` (shared with the installed build); override with `ACODE_DESKTOP_USER_DATA_DIR` if you want data to travel with the folder.
          - **Linux x64 (.AppImage)**: `chmod +x ACode-<VERSION>-linux-x86_64.AppImage && ./ACode-<VERSION>-linux-x86_64.AppImage`.
          - **Linux arm64 (.AppImage)**: `chmod +x ACode-<VERSION>-linux-arm64.AppImage && ./ACode-<VERSION>-linux-arm64.AppImage`.
          - **CLI (.tar.gz)**: requires Node.js 24. Extract and run:

            ```bash
            tar -xzf acode-<VERSION>.tar.gz
            cd acode
            ./install.sh        # installs the acode command into ~/.acode/runtime
            acode --help        # or run: node bin/acode.mjs --help
            ```

          ## 中文

          ### 相对 ACode 的改动

          - **移除全部监控与遥测**（约 2.6 万行）：ARMS RUM、OTLP 上报、崩溃采集、资源与网络采样、UI 埋点，并加了防回归检查，防止重新引入。
          - **断开官方平台服务**：账号登录、反馈上传、编码套餐、官方 MCP 凭证、插件市场与客户端远端配置在请求前短路；反馈入口指向 GitHub Issues。
          - **没有账号体系**：不需要登录，也没有任何账号概念。配置自己的 API Key 或自定义模型即可开始使用。
          - **没有购买与升级引导**：购买界面与相关文案已移除，不会引导你购买套餐。
          - **移除仓库上传行为**：快照打包与上传逻辑已删除，并加了防回归保护。
          - **开源可复核**：第一方代码 MIT，上游代码 Apache-2.0；桌面端、CLI、UI 的移除报告随仓库发布。
          - **构建透明**：安装包由 GitHub Actions 从本仓库构建；应用内更新指向本仓库的 GitHub Releases。
          - **如实说明限制**：Computer Use 为不可用占位；安装包没有 ACode 官方签名。

          ### 安装说明

          - **macOS（.dmg）**：按机型下载 `ACode-<VERSION>-mac-arm64.dmg`（Apple Silicon）或 `ACode-<VERSION>-mac-x64.dmg`（Intel），打开后把 ACode 拖进“应用程序”。没有 ACode 官方签名，Gatekeeper 会拦截首次打开——这是 macOS 独有的系统拦截。用下面命令放行一次（输入密码时不显示字符；命令会自动启动应用并立即退出）：

            ```bash
            sudo /usr/bin/xattr -rd com.apple.quarantine "/Applications/ACode.app" && open -a "ACode"
            ```

            使用 `/usr/bin/xattr` 绝对路径，避免 PATH 中同名工具干扰。也可以在“访达”里右键（Control-点击）应用 -> 打开 -> 弹窗里再点“打开”。
          - **Windows（.exe）**：运行 `ACode-<VERSION>-win-x64.exe`。没有 ACode 官方签名，SmartScreen 会显示警告——只是警告，不是系统拦截；点“**更多信息**” -> “**仍要运行**”。这是预期提示，不是文件损坏。
          - **Windows 免安装版（.zip）**：解压 `ACode-<VERSION>-win-x64.zip`，运行里面的 `ACode.exe` 即可——不跑安装器、不写注册表/开始菜单。同样未签名，SmartScreen 提示同上。注意：这是“免安装”（不跑安装器），不是完全自带数据的绿色版——用户数据仍落在 `%APPDATA%\ACode`（与安装版共享）；如需数据随文件夹携带，用环境变量 `ACODE_DESKTOP_USER_DATA_DIR` 指定目录。
          - **Linux x64（.AppImage）**：`chmod +x ACode-<VERSION>-linux-x86_64.AppImage && ./ACode-<VERSION>-linux-x86_64.AppImage`。
          - **Linux arm64（.AppImage）**：`chmod +x ACode-<VERSION>-linux-arm64.AppImage && ./ACode-<VERSION>-linux-arm64.AppImage`。
          - **CLI（.tar.gz）**：需要 Node.js 24。解压后运行：

            ```bash
            tar -xzf acode-<VERSION>.tar.gz
            cd acode
            ./install.sh        # 安装 acode 命令到 ~/.acode/runtime
            acode --help        # 或直接运行：node bin/acode.mjs --help
            ```

          ## Downloads / 产物

          - macOS Apple Silicon: `ACode-<VERSION>-mac-arm64.dmg` / `.zip`
          - macOS Intel: `ACode-<VERSION>-mac-x64.dmg` / `.zip`
          - Windows x64: `ACode-<VERSION>-win-x64.exe` (installer / 安装版) / `ACode-<VERSION>-win-x64.zip` (portable / 免安装版)
          - Linux x64: `ACode-<VERSION>-linux-x86_64.AppImage`
          - Linux arm64: `ACode-<VERSION>-linux-arm64.AppImage`
          - CLI: `acode-<VERSION>.tar.gz`
          - Checksums: `ACode-<VERSION>-checksums.txt`（全部安装包 / all installers）、`sha256.txt`（CLI tarball）
          - Update metadata: `latest*.yml`, `latest.json`

          ### Verify your download / 校验下载

          Put the checksums file in the same directory as the installers, then run / 把校验文件与安装包放同一目录后执行：

          ```bash
          sha256sum -c ACode-<VERSION>-checksums.txt        # Linux / Windows (Git Bash)
          shasum -a 256 -c ACode-<VERSION>-checksums.txt    # macOS
          # CLI tarball only / 仅 CLI 压缩包：
          sha256sum -c sha256.txt
          ```

          Every line must print `OK`. A mismatch means the download is corrupted or tampered with - do not install it. / 每一行都应输出 `OK`；不一致说明下载损坏或被篡改，请勿安装。
          NOTES
          sed -i "s/<VERSION>/${TAG#v}/g" /tmp/release-notes.md
          # 自动生成版本差异 Changelog：对比最近的 tag（排除 ci 类提交），插入到标题之后
          BASE_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$BASE_TAG" ]; then
            {
              echo "## Changelog (vs ${BASE_TAG}) / 更新日志（相对 ${BASE_TAG}）"
              echo ""
              CHANGES=$(git log --no-merges --pretty='- %s (%h)' "$BASE_TAG..${TAG}" | grep -v '^- ci' || true)
              if [ -n "$CHANGES" ]; then
                printf '%s\n' "$CHANGES"
              else
                echo "- 无代码变更 / No code changes"
              fi
              echo ""
              echo "对比完整变更 / Full diff: https://github.com/${GITHUB_REPOSITORY}/compare/${BASE_TAG}...${TAG}"
              echo ""
              echo "---"
              echo ""
            } > /tmp/changelog-section.md
            head -n 1 /tmp/release-notes.md > /tmp/release-notes-title.md
            tail -n +2 /tmp/release-notes.md > /tmp/release-notes-rest.md
            { cat /tmp/release-notes-title.md; echo; cat /tmp/changelog-section.md; cat /tmp/release-notes-rest.md; } > /tmp/release-notes-merged.md
            mv /tmp/release-notes-merged.md /tmp/release-notes.md
          fi
          # 测试版警示（如上游审计自动构建的 draft）插入到说明顶部
          if [ -n "${NOTICE:-}" ]; then
            { printf '%s\n\n' "$NOTICE"; cat /tmp/release-notes.md; } > /tmp/release-notes-with-notice.md
            mv /tmp/release-notes-with-notice.md /tmp/release-notes.md
          fi
          args=(--draft --title "$TAG" --notes-file /tmp/release-notes.md)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"

  build:
    needs: release
    if: ${{ inputs.build_artifacts }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 完整类型门禁，同时由 packages 阶段的 tsc -b 产出后续打包要消费的工程引用声明。
      - name: Typecheck all entries (builds project references)
        run: pnpm typecheck

      - name: Build ACode CLI distribution
        env:
          ACODE_DIST_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.release.outputs.tag }}/
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          pnpm build:acode -- --version "${RELEASE_TAG#v}"

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          # GitHub API 偶发连接失败（runner 网络抖动），上传重试 3 次；--clobber 让重试可安全覆盖。
          for attempt in 1 2 3; do
            if gh release upload "$TAG" \
              dist/acode/releases/*/acode-*.tar.gz \
              dist/acode/releases/*/sha256.txt \
              dist/acode/install.sh \
              dist/acode/latest.json \
              --clobber; then
              exit 0
            fi
            echo "::warning::gh release upload failed (attempt $attempt/3), retrying in 10s"
            sleep 10
          done
          echo "::error::gh release upload failed after 3 attempts"
          exit 1

  desktop:
    needs: release
    if: ${{ inputs.build_artifacts }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: mac
            arch: arm64
            glob: "*.dmg"
          - runner: macos-15-intel
            target: mac
            arch: x64
            glob: "*.dmg"
          - runner: windows-latest
            target: win
            arch: x64
            glob: "*.exe"
          - runner: ubuntu-latest
            target: linux
            arch: x64
            glob: "*.AppImage"
          # GitHub 公开仓库免费的 ARM64 runner（ubuntu-24.04-arm）；electron-builder 在原生 arm64 上
          # 打包 linux arm64 的 AppImage/deb，无需 QEMU 交叉仿真。
          # 更新元数据生成 latest-linux-arm64.yml，与 x64 的 latest-linux.yml 不冲突，可并行上传。
          - runner: ubuntu-24.04-arm
            target: linux
            arch: arm64
            glob: "*.AppImage"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 完整类型门禁，同时由 packages 阶段的 tsc -b 产出 bundle 要消费的工程引用声明；
      # renderer 类型错误在此阻断，不再只有 verify job 能拦住。
      - name: Typecheck all entries (builds project references)
        run: pnpm typecheck

      # 发布签名三态判定（specs/release-signing-smoke.md §1；语义移植自 oh-my-pi v18.12.1，MIT）：
      # 全有 → full（macOS：签名+公证；Windows：signtool），脚本经 GITHUB_ENV 写
      # ACODE_ENABLE_MAC_SIGN=1 与 CSC_IDENTITY_AUTO_DISCOVERY=true；
      # 全无 → none（保持未签名现状并明示，恒写 CSC_IDENTITY_AUTO_DISCOVERY=false）；
      # 部分存在 → 本步骤直接失败并列出缺失 secrets 键名，禁止静默降级（omp 核心教训）。
      # secrets 仅以 env 注入本步骤，脚本只输出键名与数量，绝不回显值。
      - name: Resolve release signing state
        id: signing-state
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node packages/desktop/scripts/release-signing-state.mjs --platform ${{ matrix.target }}

      - name: Bundle desktop app
        env:
          ACODE_ENV: production
          # 文件名与应用版本带上完整审计版本（如 0.0.1-audit.20260922.6），不再只写 0.0.1。
          ACODE_APP_VERSION: ${{ needs.release.outputs.version }}
          # CSC_IDENTITY_AUTO_DISCOVERY 不在此静态声明：三态判定脚本已按结果经 GITHUB_ENV
          # 写入（full=true 允许钥匙串自动发现 CSC_LINK 导入的身份；其余=false 保持未签名
          # 行为）。step env 若静态声明会覆盖 GITHUB_ENV，故删除。签名凭据整组透传给
          # electron-builder；未配置的 secrets 是空串，由 electron-builder.config.js 在载入
          # 时归一为「未设置」，mac 链路不会误入 createKeychain（spec §1 注入约定）。
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm bundle:desktop -- --os ${{ matrix.target }} --arch ${{ matrix.arch }}

      - name: Upload desktop asset to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          ls -la packages/desktop/dist/
          # latest*.yml 是 electron-updater 的更新元数据，应用靠它做自动更新；
          # macOS 自动更新需要 zip 包（electron-updater 用 zip 而不是 dmg），blockmap 供差分下载。
          shopt -s nullglob
          files=(
            packages/desktop/dist/${{ matrix.glob }}
            packages/desktop/dist/latest*.yml
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.blockmap
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no desktop assets matched in packages/desktop/dist"
            exit 1
          fi
          # GitHub API 偶发连接失败（runner 网络抖动），上传重试 3 次；--clobber 让重试可安全覆盖。
          for attempt in 1 2 3; do
            if gh release upload "$TAG" "${files[@]}" --clobber; then
              exit 0
            fi
            echo "::warning::gh release upload failed (attempt $attempt/3), retrying in 10s"
            sleep 10
          done
          echo "::error::gh release upload failed after 3 attempts"
          exit 1

  # 发布前产物验证（draft-until-success 的一环；语义移植自 oh-my-pi release_smoke，MIT）：
  # 从 draft release 下载将被打出的同一批字节再验证，任一腿失败 → publish 不执行 → 保持 draft。
  # - macOS：签名期 codesign --verify --strict + 非 adhoc 断言 + entitlements 必含
  #   disable-library-validation（原生模块 node-pty/koffi 依赖，缺失即「签名公证全过、
  #   首次真实使用即崩」）+ 启动 smoke（--remote-debugging-port 轮询 /json/version，
  #   无 --smoke-test 旗标的诚实替代，spec §3）；未签名期明示跳过验签，降级为 sha256 +
  #   结构检查（Info.plist 版本比对、关键文件存在、asar 可解析）。启动 smoke 两种态都跑。
  # - Windows：sha256 + 大小下限（<50MiB 视为损坏）；签名期附加 Get-AuthenticodeSignature=Valid。
  # - Linux：sha256 -c 校验 CLI sha256.txt 与 tarball 一致 + AppImage 哈希/大小 + x64 抽查结构。
  # 各腿产出 sha256 清单 artifact，由 publish 聚合成 ACode-<VERSION>-checksums.txt 上传。
  # 未验证声明：runner 上的启动探测与签名断言无法本地验证，以首次真实 run 为准（spec §3）。
  verify_assets:
    name: "Verify release assets: ${{ matrix.leg }}"
    needs: [release, build, desktop]
    if: ${{ !cancelled() && inputs.build_artifacts && needs.release.result == 'success' && needs.build.result == 'success' && needs.desktop.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: macos-arm64
            runner: macos-14
            os: mac
            arch: arm64
          - leg: macos-x64
            runner: macos-15-intel
            os: mac
            arch: x64
          - leg: windows-x64
            runner: windows-latest
            os: win
            arch: x64
          - leg: linux
            runner: ubuntu-latest
            os: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.tag }}
      # 与 desktop 三态脚本同一组 secrets 的存在性判定：签名期断言只在凭据齐全时要求。
      # 诚实边界：这里只用于「签名期必须验签、未签名期必须明示跳过」的分支，不改变
      # desktop 侧的三态门禁（partial 在打包前已失败，不会走到本作业）。
      MACOS_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      WIN_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' }}
    steps:
      - name: Download assets and hash (macOS)
        if: matrix.os == 'mac'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets" "$RUNNER_TEMP/checksums"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "ACode-${VERSION}-mac-${{ matrix.arch }}.dmg" \
            --pattern "ACode-${VERSION}-mac-${{ matrix.arch }}.zip" \
            --dir "$RUNNER_TEMP/assets"
          # macOS runner 无 GNU coreutils：sha256sum 不存在（exit 127，v1.0.1 首跑
          # 实证）；shasum -a 256 输出同「hash␣␣name」格式，下游 -c 校验两平台通用。
          (cd "$RUNNER_TEMP/assets" && shasum -a 256 * > "$RUNNER_TEMP/checksums/sha256-${{ matrix.leg }}.txt")
          cat "$RUNNER_TEMP/checksums/sha256-${{ matrix.leg }}.txt"
          unzip -q "$RUNNER_TEMP/assets/ACode-${VERSION}-mac-${{ matrix.arch }}.zip" -d "$RUNNER_TEMP/assets/extracted"

      - name: Inspect app bundle version (macOS)
        if: matrix.os == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/assets/extracted" -maxdepth 1 -name '*.app' -type d | head -n1)"
          if [ -z "$APP_PATH" ]; then echo "::error::.app bundle not found in mac zip"; exit 1; fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          BUNDLE_VERSION="$(plutil -extract CFBundleShortVersionString raw "$APP_PATH/Contents/Info.plist")"
          if [ "$BUNDLE_VERSION" != "$VERSION" ]; then
            echo "::error::Info.plist version $BUNDLE_VERSION != release version $VERSION"
            exit 1
          fi
          echo "bundle version: $BUNDLE_VERSION"

      - name: Verify codesign signature (macOS, signing enabled)
        if: matrix.os == 'mac' && env.MACOS_SIGNING == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "签名期：执行 codesign 验证"
          codesign --verify --strict --verbose=2 "$APP_PATH"
          info="$(codesign -dvvv "$APP_PATH" 2>&1)"
          echo "$info"
          if grep -qE "flags=.*adhoc|Signature=adhoc" <<< "$info"; then
            echo "::error::$APP_PATH is ad-hoc signed while signing secrets are configured (Developer ID signing did not run)"
            exit 1
          fi
          # omp 教训回归检查：原生模块（node-pty/koffi 等 dlopen 加载、无独立签名）要求
          # 库校验豁免；缺失时签名公证全过但首次真实使用即崩（spec §2 entitlements 表）。
          codesign -d --entitlements :- "$APP_PATH" | grep -q "disable-library-validation" || {
            echo "::error::entitlements missing com.apple.security.cs.disable-library-validation (native modules would crash at first real use)"
            exit 1
          }
          # 参考信息不设门禁：spctl 依赖 Apple 线上票据查询，可能临时不可用（omp 同策略）。
          spctl -a -vv -t exec "$APP_PATH" || echo "spctl non-zero (informational only)"

      - name: Structure check (macOS, unsigned)
        if: matrix.os == 'mac' && env.MACOS_SIGNING != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "未签名，跳过验签（当前仓库未配置 macOS 签名 secrets，三态 none；发布说明已明示 Gatekeeper 放行方式）"
          for rel in "Contents/Info.plist" "Contents/Resources/app.asar" "Contents/Resources/config/default.json"; do
            [ -e "$APP_PATH/$rel" ] || { echo "::error::missing $rel"; exit 1; }
          done
          ls "$APP_PATH/Contents/MacOS"
          # asar 完整性：用与打包一致的 @electron/asar 解析归档，损坏会在此报错。
          npx --yes @electron/asar@3.4.1 list "$APP_PATH/Contents/Resources/app.asar" > "$RUNNER_TEMP/asar-list.txt"
          lines="$(wc -l < "$RUNNER_TEMP/asar-list.txt")"
          echo "asar entries: $lines"
          if [ "$lines" -lt 100 ]; then echo "::error::asar listing suspiciously small ($lines entries)"; exit 1; fi

      - name: Launch smoke (macOS)
        if: matrix.os == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(find "$APP_PATH/Contents/MacOS" -maxdepth 1 -type f -perm -111 | head -n1)"
          LOG="$RUNNER_TEMP/acode-smoke.log"
          # 无开关启动探测（v1.0.1 第三轮修正）：打包态启动守卫会拒绝
          # --remote-debugging-port 等调试开关（specs/desktop-startup-hardening.md §1；
          # 未签名产物无签名调试令牌），原 CDP 探针对打包产物必然被拒——守卫行为
          # 正确、错的是探测方式。改为无开关启动 + 存活探针：进程持续存活且出现
          # Electron helper 子进程（越过早期初始化的证据）；日志出现拒绝标记立即失败。
          echo "launch smoke: ${BIN}（无开关启动，存活+helper 子进程探针，失败转储 stdio）"
          "$BIN" >"$LOG" 2>&1 &
          APP_PID=$!
          ok=""
          for i in $(seq 1 15); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "::error::app exited during launch smoke"; tail -80 "$LOG"; exit 1
            fi
            if grep -q "refusing to start" "$LOG" 2>/dev/null; then
              echo "::error::boot guard refused launch"; tail -80 "$LOG"; exit 1
            fi
            if [ "$i" -ge 8 ] && pgrep -P "$APP_PID" >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::app alive but no Electron helper children within ~30s"; tail -80 "$LOG"; exit 1
          fi
          echo "launch smoke OK (alive + helper children; log lines: $(wc -l < "$LOG"))"
          pkill -f "$APP_PATH" 2>/dev/null || true
          sleep 3
          pkill -9 -f "$APP_PATH" 2>/dev/null || true

      - name: Upload checksum list (macOS)
        if: matrix.os == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums-${{ matrix.leg }}
          path: ${{ runner.temp }}/checksums/sha256-${{ matrix.leg }}.txt
          if-no-files-found: error

      - name: Download, hash and size-check installer + portable zip (Windows)
        if: matrix.os == 'win'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets" "$RUNNER_TEMP/checksums"
          # 安装版（nsis .exe）+ 免安装版（.zip）两个产物都下载校验。
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "ACode-${VERSION}-win-${{ matrix.arch }}.exe" \
            --pattern "ACode-${VERSION}-win-${{ matrix.arch }}.zip" \
            --dir "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          ls -la
          # 大小下限：全量 Electron 产物不可能小于 50MiB，防止截断/空文件被发布。
          for f in "ACode-${VERSION}-win-${{ matrix.arch }}.exe" "ACode-${VERSION}-win-${{ matrix.arch }}.zip"; do
            size="$(stat -c %s "$f")"
            if [ "$size" -lt 52428800 ]; then echo "::error::$f too small: $size bytes"; exit 1; fi
            echo "$f size: $size bytes"
          done
          # 校验和清单含两个产物（publish 聚合成 ACode-<VERSION>-checksums.txt）。
          sha256sum "ACode-${VERSION}-win-${{ matrix.arch }}.exe" "ACode-${VERSION}-win-${{ matrix.arch }}.zip" \
            > "$RUNNER_TEMP/checksums/sha256-${{ matrix.leg }}.txt"
          cat "$RUNNER_TEMP/checksums/sha256-${{ matrix.leg }}.txt"

      - name: Structure check portable zip (Windows)
        if: matrix.os == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 免安装版解压后应含主可执行文件（按产品名 ACode.exe 精确断言）与 resources/app.asar
          # （证明 zip 非损坏、结构完整）。26R2-03：旧检查 `Get-ChildItem -Filter '*.exe' |
          # Select-Object -First 1` 只证明「存在某个 exe」——若主 exe 改名/缺失而其他辅助 exe
          # 在场仍会通过。改为按 electron-builder productName（production 身份 = ACode，见
          # packages/desktop/scripts/desktop-product-identity.mjs）精确断言 ACode.exe。
          # 解压到子目录，避免污染上层 assets 的 *.exe（顶层签名校验只针对 nsis 安装包）。
          $zip = "$env:RUNNER_TEMP\assets\ACode-${env:VERSION}-win-${{ matrix.arch }}.zip"
          $dest = "$env:RUNNER_TEMP\assets\zip-extracted"
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          $exe = Join-Path $dest 'ACode.exe'
          if (-not (Test-Path -LiteralPath $exe)) { Write-Host "::error::ACode.exe not found in portable zip"; exit 1 }
          $asar = Join-Path $dest 'resources\app.asar'
          if (-not (Test-Path -LiteralPath $asar)) { Write-Host "::error::resources/app.asar missing in portable zip"; exit 1 }
          Write-Host "portable zip OK: ACode.exe + resources/app.asar present"

      - name: Verify Authenticode signature (Windows, signing enabled)
        if: matrix.os == 'win' && env.WIN_SIGNING == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 顶层 nsis 安装包签名。
          $installer = Get-ChildItem "$env:RUNNER_TEMP\assets\*.exe" | Select-Object -First 1
          $installerSig = Get-AuthenticodeSignature -FilePath $installer.FullName
          Write-Host "installer Authenticode status: $($installerSig.Status); signer: $($installerSig.SignerCertificate.Subject)"
          if ($installerSig.Status -ne 'Valid') {
            Write-Host "::error::installer signature is $($installerSig.Status), expected Valid"
            exit 1
          }
          # 便携 zip 内层 ACode.exe 签名（26R2-03）：zip 与 nsis 共用同一 win-unpacked app
          # 目录，签名开启时内层 exe 也应已签名。此前只校验顶层安装包，内层便携 exe 的
          # Authenticode 即便 WIN_SIGNING=true 也不检查（旧注释刻意把签名限定于顶层 nsis）。
          # 结构检查步已把 zip 解压到 zip-extracted，这里按名显式校验内层 exe。
          $portable = Join-Path "$env:RUNNER_TEMP\assets\zip-extracted" 'ACode.exe'
          if (-not (Test-Path -LiteralPath $portable)) {
            Write-Host "::error::portable ACode.exe missing for signature check: $portable"
            exit 1
          }
          $portableSig = Get-AuthenticodeSignature -FilePath $portable
          Write-Host "portable Authenticode status: $($portableSig.Status); signer: $($portableSig.SignerCertificate.Subject)"
          if ($portableSig.Status -ne 'Valid') {
            Write-Host "::error::portable ACode.exe signature is $($portableSig.Status), expected Valid"
            exit 1
          }

      - name: Signature note (Windows, unsigned)
        if: matrix.os == 'win' && env.WIN_SIGNING != 'true'
        shell: bash
        run: echo "未签名，跳过验签（当前仓库未配置 Windows 签名 secrets，三态 none；发布说明已明示 SmartScreen 放行方式）"

      - name: Upload checksum list (Windows)
        if: matrix.os == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums-${{ matrix.leg }}
          path: ${{ runner.temp }}/checksums/sha256-${{ matrix.leg }}.txt
          if-no-files-found: error

      - name: Verify CLI checksums and AppImages (Linux)
        if: matrix.os == 'linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets" "$RUNNER_TEMP/checksums"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "ACode-${VERSION}-linux-*.AppImage" \
            --pattern "acode-${VERSION}.tar.gz" \
            --pattern "sha256.txt" \
            --pattern "latest.json" \
            --dir "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          ls -la
          # CLI sha256.txt 与 tarball 的一致性：发布前对该文件本身的权威校验（spec §5）。
          sha256sum -c sha256.txt
          for f in ACode-${VERSION}-linux-*.AppImage; do
            size="$(stat -c %s "$f")"
            if [ "$size" -lt 52428800 ]; then echo "::error::$f too small: $size bytes"; exit 1; fi
          done
          sha256sum ACode-${VERSION}-linux-*.AppImage acode-${VERSION}.tar.gz > "$RUNNER_TEMP/checksums/sha256-${{ matrix.leg }}.txt"
          # x64 AppImage 无需 FUSE 的结构抽查；arm64 runtime 无法在 x64 runner 执行，仅哈希校验。
          chmod +x ACode-${VERSION}-linux-x86_64.AppImage
          ./ACode-${VERSION}-linux-x86_64.AppImage --appimage-extract > /dev/null
          [ -f squashfs-root/resources/app.asar ] || { echo "::error::AppImage missing resources/app.asar"; exit 1; }
          jq -e --arg v "${VERSION}" '.version == $v' latest.json > /dev/null || { echo "::error::latest.json version mismatch"; exit 1; }
          cat "$RUNNER_TEMP/checksums/sha256-${{ matrix.leg }}.txt"

      - name: Upload checksum list (Linux)
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums-${{ matrix.leg }}
          path: ${{ runner.temp }}/checksums/sha256-${{ matrix.leg }}.txt
          if-no-files-found: error

  # 只有 CLI 与全部桌面平台产物上传成功、且发布前产物验证全部通过，才公开 release；
  # 任一构建或验证失败则保持 draft，由人工排查后重跑或删除，避免不完整或损坏的版本
  # 出现在 Releases 与官网下载页。keep_draft=true（上游审计自动构建的测试版）：
  # 即使全部成功也保持 draft，不公开、不进入自动更新。
  publish:
    needs: [release, build, desktop, verify_assets, desktop-smoke]
    # desktop-smoke 是追加的发布级闸门（spec ci-platform-matrix R2 规则 9）：Electron 启动链路
    # smoke 必须 success 才公开 release，否则保持 draft。fail-closed：不给 skipped 兜底，
    # smoke 未成功（失败/取消）一律不发布。
    if: ${{ always() && inputs.keep_draft != true && needs.release.result == 'success' && needs.desktop-smoke.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped') && (needs.verify_assets.result == 'success' || needs.verify_assets.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download per-leg checksum lists
        if: ${{ inputs.build_artifacts }}
        uses: actions/download-artifact@v4
        with:
          pattern: release-checksums-*
          path: checksums
          merge-multiple: true

      - name: Upload aggregated checksums to release
        if: ${{ inputs.build_artifacts }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          # <hash>␣␣<文件名> 格式，sha256sum -c / shasum -a 256 -c 直接可用。
          cat checksums/*.txt | sort -k2,2 -u > "ACode-${VERSION}-checksums.txt"
          cat "ACode-${VERSION}-checksums.txt"
          # 校验和上传失败同样阻断公开（保持 draft），fail-closed 与既有上传一致。
          # --repo 必带：publish job 无 checkout，gh 无 git 上下文推不出仓库
          # （v1.0.1 正式轮实证「failed to run git: not a git repository」）；
          # 与下方 Publish release 步的 --repo "$GITHUB_REPOSITORY" 同式。
          for attempt in 1 2 3; do
            if gh release upload "$TAG" "ACode-${VERSION}-checksums.txt" --clobber --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            echo "::warning::checksums upload failed (attempt $attempt/3), retrying in 10s"
            sleep 10
          done
          echo "::error::checksums upload failed after 3 attempts"
          exit 1

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--draft=false --repo "$GITHUB_REPOSITORY")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release edit "$TAG" "${args[@]}"
