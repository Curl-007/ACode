<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      安全加固 P2（specs/electron-hardening.md §3b）：辅助窗 CSP，是主窗 index.html CSP 的已验证子集。
      - script-src/style-src 同主窗：module script 走 vite chunk（'self'，打包态 file:），'unsafe-inline'
        覆盖 dev 态 Vite 内联脚本与本文件整段内联 <style>；
      - img-src data:：真实 ACode 图标由 main 经 state.iconDataUrl（data: URL）推送，在 cuaPermissionPanel.ts
        里以 icon.style.backgroundImage=url(...) 设置（图片资源受 img-src 约束）；
      - connect-src 收紧为 'self' ws: wss:：本窗只经 window.cuaPermissionPanel IPC bridge 通信（非网络），
        无 fetch/XHR/WebSocket；ws: 仅供 dev HMR。不保留 http/https（无远端取数面）；
      - 无 frame-src（无 <webview>）、无 media-src/acode-media:（不做音视频预览）；
      - object-src/base-uri/form-action 'none' 封死插件、基址劫持、表单外送。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file: 'unsafe-inline'; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob:; font-src 'self' file: data:; connect-src 'self' ws: wss:; worker-src 'self' file: blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>ACode Computer Use</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font:
          13px -apple-system,
          system-ui,
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      .panel {
        display: flex;
        align-items: center;
        gap: 16px;
        height: 100%;
        box-sizing: border-box;
        padding: 0 22px;
        border-radius: 16px;
        background: rgba(250, 250, 250, 0.98);
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.22);
      }
      /* 拖拽源：用户按住它拖进系统设置的权限列表 */
      .tile {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px;
        background: #fff;
        border: 1px solid #dcdcdc;
        border-radius: 12px;
        cursor: grab;
        flex-shrink: 0;
      }
      .tile:active {
        cursor: grabbing;
      }
      .icon {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        /* 占位：main 推送真实 ACode 图标后被 background-image 覆盖 */
        background: linear-gradient(135deg, #1fa9fd, #f0bcee);
        background-size: cover;
        background-position: center;
        flex-shrink: 0;
      }
      .name {
        font-size: 14px;
        font-weight: 600;
        color: #434343;
        white-space: nowrap;
      }
      .arrow {
        flex-shrink: 0;
        color: #0a84ff;
        animation: nudge-up 1.5s ease-in-out infinite;
      }
      @keyframes nudge-up {
        0%,
        100% {
          transform: translateY(4px);
          opacity: 0.45;
        }
        50% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }
      /* 尊重系统的减弱动效设置：停掉动画但保留箭头本身的指示作用 */
      @media (prefers-reduced-motion: reduce) {
        .arrow {
          animation: none;
          opacity: 1;
        }
      }
      .hint {
        color: #6a6a6a;
        line-height: 1.5;
      }
      .hint strong {
        color: #1d1d1f;
        font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        .panel {
          background: rgba(40, 40, 42, 0.98);
          border-color: rgba(255, 255, 255, 0.1);
        }
        .arrow {
          color: #409cff;
        }
        .tile {
          background: #3a3a3c;
          border-color: #4a4a4c;
        }
        .name {
          color: #e8e8ea;
        }
        .hint {
          color: #a1a1a6;
        }
        .hint strong {
          color: #f5f5f7;
        }
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="tile" id="tile" draggable="true">
        <div class="icon"></div>
        <div class="name" id="appName">ACode Computer Use</div>
      </div>
      <svg
        class="arrow"
        width="26"
        height="26"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M12 20V5" />
        <path d="M5.5 11.5 12 5l6.5 6.5" />
      </svg>
      <div class="hint" id="hint">
        <span id="hintPrefix"></span><strong id="permissionLabel"></strong
        ><span id="hintSuffix"></span><br />
        <span id="completion"></span>
      </div>
    </div>
    <script type="module" src="./cuaPermissionPanel.ts"></script>
  </body>
</html>
