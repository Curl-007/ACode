# 持续集成门禁：每次 push / PR 运行静态检查与全量测试。
#
# 背景（2026-10-05 深度审查）：此前仓库没有任何自动化测试入口——package.json 无
# test 脚本、CI 只跑 typecheck 与打包、husky 钩子未入库，提交信息宣称的「全绿」
# 依赖手工执行且不可复现（Windows 工作区实测 979/980）。本 workflow 与各包固化的
# `test` 脚本（node --import tsx --test）一起构成「绿」的唯一权威判定：
# - typecheck / lint / architecture:check：静态与架构基线；
# - pnpm test：pnpm -r --workspace-concurrency=1 run test，串行跑全部 10 个包的套件
#   （services/shared/ui/desktop/server/provider/provider-node/rpc/harness-sdk/CLI）。
# 任一步骤失败即门禁失败；本文件不做 baseline 自动刷新（与 architecture 技能约定一致）。
name: CI

on:
  push:
    branches: ["main", "dev/**", "release/**", "hotfix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # CI 缓存纪律（omp 教训：每 PR 保存一份大缓存曾吃掉 9.4GB/10GB 配额）：
      # 本 workflow 所有触发（PR/push/dispatch）一律只 restore 不 save——
      # setup-node 的 cache: pnpm 无法关掉保存半边，故改用显式 actions/cache/restore；
      # 缓存条目由 .github/workflows/warm-cache.yml 在 main/dev 推送时专职生产，
      # 键与路径逐字符一致：pnpm-store-Linux-<pnpm-lock.yaml 哈希> / ~/.local/share/pnpm/store。
      - name: Restore pnpm store cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-Linux-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-Linux-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 单一类型门禁入口 scripts/typecheck-gate.mjs：packages（tsc -b）先行，
      # desktop-renderer 与 cli（turbo，含 @acode/cli 自身入口）在其后并行。
      # 规则与验收见 docs/specs/cli-validation-gates.md 第 3-6 条；本 workflow
      # 不再内联 renderer / CLI 单入口命令，避免出现跳过其中之一的旁路。
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Architecture check
        run: pnpm architecture:check

      # 死文件/死依赖门禁（2026-10-05 起清理至零并冻结）；exports/types 两类
      # 是登记在 docs/tech-debt-backlog.md 的 backlog，不在门禁内。
      - name: Knip (files & dependencies gate)
        run: pnpm knip:gate

      # 台账 inputs 新鲜度（U13，docs/upgrades/quality-and-release-2026-10.md）：只重算
      # third-party/inventory.json 登记的 2869 个源文件哈希并与工作树比对，零 install、
      # 秒级。判定逻辑单一入口在 scripts/third-party-reproducibility.mjs，本地与 CI 同源。
      # 这是开发期信号、非发布权威：看不见 packages / noticesSha256 等依赖树派生字段，
      # 依赖漂移由 licenses-notices.yml 的全量重生成兜住（release 路径的权威校验）。
      - name: Third-party ledger inputs freshness
        run: node scripts/licenses.mjs reproducibility --inputs-only

      # 测试经 tsx 直接引 apps/acode-cli 各包源码，而这些源码按包名解析兄弟包的 dist/。
      # 类型门禁的 cli 阶段经 turbo `dependsOn: ["^build"]` 已产出这些 dist，这里仍保留
      # 显式构建步骤，使 Tests 的前置不依赖门禁内部阶段顺序（干净检出没有 dist 时 Tests
      # 会 ERR_MODULE_NOT_FOUND，@acode/contracts/dist/index.js，2026-10-07 release/0.0.4
      # 的 CI 实测）；turbo 缓存命中时该步骤几乎无成本。
      - name: Build CLI workspace packages
        run: npx turbo --skip-infer --cwd apps/acode-cli run build --filter='!@acode/cli'

      # CLI 各包再经自己的就近配置执行 lint，确保独立 workspace 的交付门禁与根扫描同时有效。
      - name: Lint CLI workspace
        run: pnpm exec turbo --cwd apps/acode-cli run lint

      - name: Tests (all packages)
        run: pnpm test

  remote-ssh:
    name: Remote SSH release smoke
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # 与 verify 同一缓存纪律：只 restore 不 save，条目由 warm-cache.yml 生产。
      - name: Restore pnpm store cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-Linux-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-Linux-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Stage Linux server release
        run: pnpm --filter @acode/server-cli stage --target linux-x64
      - name: Verify remote SSH lifecycle
        run: pnpm --filter @acode/server-cli verify:remote-ssh

  # Windows 平台 leg（docs/specs/ci-platform-matrix.md R1；根因 review 测试专项 R1-03）：
  # verify 只在 ubuntu 跑，近期 win32 文件系统语义 bug（read-state 大小写 66a11532、
  # prompt-routing walk-up 01d457f8、8.3 短名）在 Linux 上恒走 posix 分支、门禁恒绿。
  # 这里独立成 job（不把 verify 改 matrix）：Windows 首跑若暴露既有 win32 失败，失败面与
  # 主门禁隔离，不连带弄红 ubuntu leg。必需 job：失败即 CI 整体红，不为过 CI 放宽测试。
  #
  # 缓存纪律：warm-cache.yml 只生产 Linux 条目，Windows 无生产者，故本 job 不加任何
  # actions/cache、不用 setup-node 的 cache:pnpm（会 save，违反 omp「只 restore 不 save」教训）。
  # Node 钉 24.14.0（对齐 mise.toml）消除 runner 次版本漂移；run 统一 shell:bash（windows-latest
  # 自带 Git Bash），避免 pwsh/bash 在 --filter、glob、退出码上的语义差异。
  windows-verify:
    name: Windows verify (typecheck + lint + core/services/shared)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      # 单一类型门禁入口，与 verify 逐字一致（cli-validation-gates.md 规则 5，不得内联单入口）。
      - name: Typecheck
        shell: bash
        run: pnpm typecheck

      - name: Lint
        shell: bash
        run: pnpm lint

      # core 测试经 tsx 引 apps/acode-cli 源码，源码按包名解析 @acode/contracts 的 dist/
      # （main: ./dist/index.js）；干净检出无 dist 会 ERR_MODULE_NOT_FOUND（与 verify 同因）。
      - name: Build CLI workspace packages
        shell: bash
        run: npx turbo --skip-infer --cwd apps/acode-cli run build --filter='!@acode/cli'

      # 三包分开跑，任一失败即红；services/shared 的依赖经 src/*.ts 直接解析，与 core 同批构建。
      - name: Tests (core)
        shell: bash
        run: pnpm --filter @acode/core test

      - name: Tests (services)
        shell: bash
        run: pnpm --filter @acode/services test

      - name: Tests (shared)
        shell: bash
        run: pnpm --filter @acode/shared test
