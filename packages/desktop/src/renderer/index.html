<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      安全加固 P2 #2c（specs/electron-hardening.md §3）：主特权窗 CSP，对齐辅助窗（aboutWindow 等）
      的 meta CSP 形态，但覆盖主窗真实资源面：
      - 'unsafe-inline'：本文件的启动动画 module script + dev 态 Vite/React-refresh 内联注入（辅助窗同款处理）；
      - 'wasm-unsafe-eval'：Shiki 代码高亮（Oniguruma WASM）经 WebAssembly.instantiate 编译，CSP 下必须放行；
        只允许 WASM 编译、不允许任意 eval()，WASM 二进制来自打包产物（self/file:），非远端；
      - file: 源：打包态 loadFile 页面 origin 为 opaque，'self' 不匹配 file: 子资源；
      - ws: 覆盖 dev HMR websocket；http/https 保留 renderer 既有远程取数面（图片预览、发布说明等）；
      - frame-src http:/https:：内嵌浏览器与 Coding Plan 是 <webview> guest（frame-src 对 webview 生效），
        guest 自身导航白名单仍由 main 侧 will-attach-webview / guest 守卫负责；
      - media-src acode-media:：本地音视频预览走 LOCAL_MEDIA_PREVIEW_SCHEME（packages/shared）。
      - script-src acode-viz-vendor:：可视化卡片沙箱 iframe 的 srcdoc 文档继承本 CSP，
        且需同时通过「继承的父策略 ∩ iframe 自身 meta 策略」；桌面生产（file: 页面）
        vendored 钉版渲染库（mermaid/chart.js）经 main 的 VISUALIZATION_VENDOR_SCHEME
        本地协议装载（src/main/visualizationVendorProtocol.ts，仅服务打包资产目录、
        按 manifest sha256 fail-closed），故父策略 script-src 必须放行该 scheme。
        机制与安全论证见 packages/ui/specs/gen-ui-visualize-card.md「vendored 钉版渲染库」。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file: acode-viz-vendor: 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob: acode-media: https: http:; media-src 'self' file: data: blob: acode-media: https: http:; font-src 'self' file: data:; connect-src 'self' file: data: blob: ws: wss: http: https: acode-media:; worker-src 'self' file: blob:; frame-src http: https: 'self' file:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // specs/boot-placeholder.md §7 head 相位：现有 CSP script-src 已含 'unsafe-inline'，
      // 零 CSP 改动；payload 由 preload 解析 --acode-boot-placeholder= argv 暴露，缺失/未启用
      // no-op。标记间函数源与 src/main/bootPlaceholder.ts BOOT_PLACEHOLDER_PAINT_SOURCE
      // 逐字一致（tests/boot-placeholder.test.mjs 守护），禁止只改一边。
      // acode-boot-placeholder-paint:start
      var paintACodeBootPlaceholder = function (placeholder, phase) {
        try {
          var root = document.documentElement;
          var body = document.body;
          if (body && body.classList && body.classList.contains("acode-startup-ready")) {
            root.removeAttribute("data-acode-boot-placeholder");
            root.removeAttribute("data-acode-boot-placeholder-frame");
            root.removeAttribute("data-acode-boot-theme");
            root.style.removeProperty("--acode-boot-placeholder-sidebar-width");
            return;
          }
          var frame = placeholder && placeholder.frame;
          var host = document.getElementById("acode-boot-placeholder-shapes");
          var paintShapes = function (shapes) {
            if (!host) {
              return;
            }
            host.textContent = "";
            var vw = window.innerWidth;
            var vh = window.innerHeight;
            if (!(vw > 0) || !(vh > 0)) {
              return;
            }
            var radiusBase = Math.min(vw, vh);
            for (var i = 0; shapes && i < shapes.length; i++) {
              var s = shapes[i];
              var el = document.createElement("div");
              el.style.top = s.top * vh + "px";
              el.style.left = s.left * vw + "px";
              el.style.width = s.width * vw + "px";
              el.style.height = s.height * vh + "px";
              el.style.borderRadius = s.radius * radiusBase + "px";
              host.appendChild(el);
            }
          };
          var create = phase === "head";
          if (create) {
            if (!placeholder || placeholder.enabled !== true || !frame) {
              return;
            }
            var theme = "dark";
            try {
              var stored = window.localStorage.getItem("acode-theme");
              if (stored === "light" || stored === "zai-light") {
                theme = "light";
              } else if (stored === "system") {
                theme = window.matchMedia("(prefers-color-scheme: dark)").matches
                  ? "dark"
                  : "light";
              }
            } catch (_themeError) {}
            root.setAttribute("data-acode-boot-placeholder", "");
            root.setAttribute("data-acode-boot-theme", theme);
          } else if (!root.hasAttribute("data-acode-boot-placeholder")) {
            return;
          }
          if (phase === "body") {
            if (frame && root.hasAttribute("data-acode-boot-placeholder-frame")) {
              paintShapes(frame.shapes);
            }
            return;
          }
          var shown = root.getAttribute("data-acode-boot-placeholder-frame");
          root.removeAttribute("data-acode-boot-placeholder-frame");
          root.style.removeProperty("--acode-boot-placeholder-sidebar-width");
          paintShapes(null);
          if (!frame || (!create && !shown)) {
            return;
          }
          var collapsed = frame.collapsed === true;
          if (!collapsed) {
            root.style.setProperty(
              "--acode-boot-placeholder-sidebar-width",
              frame.sidebarWidth * window.innerWidth + "px",
            );
          }
          root.setAttribute(
            "data-acode-boot-placeholder-frame",
            collapsed ? "collapsed" : "sidebar",
          );
          if (host) {
            paintShapes(frame.shapes);
          }
        } catch (_paintError) {}
      };
      // acode-boot-placeholder-paint:end
      paintACodeBootPlaceholder(globalThis.__ACODE_BOOT_PLACEHOLDER__, "head");
    </script>
    <title>ACode</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      #root {
        opacity: 0;
        transition: opacity 0.16s ease;
      }

      body.acode-startup-ready #root {
        opacity: 1;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.16s ease;
      }

      body.acode-startup-ready #loading {
        pointer-events: none;
        opacity: 0;
      }

      .startup-logo-shell {
        position: relative;
        display: flex;
        width: 96px;
        height: 96px;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: linear-gradient(180deg, #000000 0%, #151718 100%);
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.2),
          0 8px 10px -6px rgb(0 0 0 / 0.2);
        transform: scale(0.72);
        opacity: 0;
        animation: startup-logo-pop 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transform-origin: center;
      }

      .startup-logo-shell::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        /* 启动 logo 壳是固定深色底，边框不能跟随浅色主题 token，否则首屏边框过重。*/
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: inherit;
      }

      .startup-logo {
        width: 56px;
        height: auto;
        color: #ffffff;
      }

      @keyframes startup-logo-pop {
        0% {
          opacity: 0;
          transform: scale(0.72);
        }

        38% {
          opacity: 1;
          transform: scale(1.045);
        }

        58% {
          transform: scale(0.985);
        }

        76% {
          transform: scale(1.008);
        }

        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-logo-shell {
          opacity: 1;
          transform: scale(1);
          animation: none;
        }
      }

      /* specs/boot-placeholder.md §7：上次会话布局骨架。首帧时 React/样式表尚未加载，
         颜色一律 var(--color-*, <硬编码回退>)：回退值取 zai-light(#f8f8f8/#f0f0f0) 与
         zai-dark(#161616) token；样式表加载后同名变量在计算值阶段自动升级，无需重绘。 */
      #acode-boot-placeholder {
        --acode-boot-placeholder-ground: var(--color-background, #f8f8f8);
        --acode-boot-placeholder-sidebar-bg: var(--color-sidebar, #f0f0f0);
        --acode-boot-placeholder-seam: var(--color-border, rgba(13, 13, 13, 0.1));
        --acode-boot-placeholder-row: var(--color-surface, rgba(13, 13, 13, 0.06));

        position: fixed;
        inset: 0;
        /* 低于 #loading(2147483647) 一级：品牌动画与全屏 [app-region:drag] 拖拽面仍盖在
           骨架上，骨架自身 pointer-events:none，无需原版 drag strip（无双拖拽区冲突）。 */
        z-index: 2147483646;
        display: none;
        pointer-events: none;
        background-color: var(--acode-boot-placeholder-ground);
      }

      html[data-acode-boot-theme="dark"] #acode-boot-placeholder {
        --acode-boot-placeholder-ground: var(--color-background, #161616);
        --acode-boot-placeholder-sidebar-bg: var(--color-sidebar, #161616);
        --acode-boot-placeholder-seam: var(--color-border, rgba(255, 255, 255, 0.1));
        --acode-boot-placeholder-row: var(--color-surface, rgba(255, 255, 255, 0.08));
      }

      html[data-acode-boot-placeholder] #acode-boot-placeholder {
        display: block;
      }

      /* startup-ready 时骨架立即隐藏，随 #loading 一起在既有 500ms 清理定时器中移除
         （spec §1：不做第二套移除时序，不打双遮罩淡出竞争）。 */
      body.acode-startup-ready #acode-boot-placeholder {
        display: none;
      }

      #acode-boot-placeholder-sidebar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        box-sizing: border-box;
        display: none;
        width: var(--acode-boot-placeholder-sidebar-width, 0px);
        border-right: 1px solid var(--acode-boot-placeholder-seam);
        background-color: var(--acode-boot-placeholder-sidebar-bg);
      }

      html[data-acode-boot-placeholder-frame="sidebar"] #acode-boot-placeholder-sidebar {
        display: block;
      }

      #acode-boot-placeholder-shapes {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      #acode-boot-placeholder-shapes > div {
        position: absolute;
        background-color: var(--acode-boot-placeholder-row);
      }
    </style>
  </head>
  <body>
    <!-- specs/boot-placeholder.md：上次会话布局骨架容器（默认隐藏，head 相位脚本置
         html[data-acode-boot-placeholder] 后显示）；#loading 仍在最上层负责动画与拖拽。 -->
    <div id="acode-boot-placeholder" aria-hidden="true">
      <div id="acode-boot-placeholder-sidebar"></div>
      <div id="acode-boot-placeholder-shapes"></div>
    </div>
    <script>
      // body 相位：宿主节点已就绪，按 head 相位 stamped 状态绘制骨架；head 脚本未执行时静默跳过。
      if (typeof paintACodeBootPlaceholder === "function") {
        paintACodeBootPlaceholder(globalThis.__ACODE_BOOT_PLACEHOLDER__, "body");
      }
    </script>
    <div id="root"></div>
    <div
      id="loading"
      class="[app-region:drag]"
      role="status"
      aria-busy="true"
      aria-label="Loading..."
    >
      <div class="startup-logo-shell">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="140"
          height="137"
          fill="none"
          viewBox="156 162 712 700"
          class="startup-logo"
          aria-hidden="true"
        >
          <!-- 品牌终端提示符与方块光标，银白渐变，与图标同款。 -->
          <defs>
            <linearGradient
              id="startup-brand-gradient"
              x1="238"
              y1="244"
              x2="542"
              y2="780"
              gradientUnits="userSpaceOnUse"
            >
              <stop offset="0" stop-color="#f1f5f9" />
              <stop offset="1" stop-color="#64748b" />
            </linearGradient>
          </defs>
          <path
            d="M238 244L542 512L238 780"
            fill="none"
            stroke="url(#startup-brand-gradient)"
            stroke-width="164"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <rect x="668" y="412" width="200" height="200" rx="44" fill="#f8fafc" />
        </svg>
      </div>
    </div>
    <script type="module">
      const startupLogoShell = document.querySelector(".startup-logo-shell");
      const startupLoading = document.getElementById("loading");
      const isUpdateStatusWindow =
        new URLSearchParams(window.location.search).get("windowKind") === "update-status";
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let finished = false;
      let animationDone = false;
      let reactReady = false;

      // 主入口不能依赖动画结束后的动态 import；一旦导入路径在 Electron/Vite 下失败，
      // 页面会永久停在 HTML loading。这里让主入口静态加载，只把启动壳作为动画遮罩延迟移除。
      const tryFinishStartupAnimation = () => {
        if (finished || !animationDone || !reactReady) return;
        finished = true;
        document.body.classList.add("acode-startup-ready");
        window.setTimeout(() => {
          startupLoading?.remove();
          // boot 骨架与 #loading 一同退场（specs/boot-placeholder.md §1）：CSS 已在 startup-ready 时立即隐藏，这里清掉残留节点。
          document.getElementById("acode-boot-placeholder")?.remove();
        }, 500);
      };

      const markAnimationDone = () => {
        animationDone = true;
        tryFinishStartupAnimation();
      };

      const markReactReady = () => {
        reactReady = true;
        tryFinishStartupAnimation();
      };

      if (isUpdateStatusWindow) {
        // 更新状态窗口本身就是一个轻量弹窗，复用主入口 HTML 时不应再显示启动壳。
        // 否则透明独立窗口里的启动 logo 会短暂或持续盖在更新按钮上，看起来像弹窗 UI 异常。
        finished = true;
        document.body.classList.add("acode-startup-ready");
        startupLoading?.remove();
      } else {
        window.addEventListener("acode-react-startup-ready", markReactReady, { once: true });
      }

      if (isUpdateStatusWindow || reduceMotion || !startupLogoShell) {
        markAnimationDone();
      } else {
        startupLogoShell.addEventListener("animationend", markAnimationDone, { once: true });
        window.setTimeout(markAnimationDone, 1000);
      }

      if (!isUpdateStatusWindow) {
        window.setTimeout(markReactReady, 3000);
      }
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
