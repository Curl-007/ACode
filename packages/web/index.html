    <title>ACode</title>
    <script>
      (() => {
        // JS bundle 执行前先按本地主题偏好决定首屏底色，避免 dark 用户在这一帧看到白底闪烁。
        const STORAGE_KEY = "acode-theme";
        const DEFAULT_THEME = "zai-dark";
        const BROWSER_THEME_COLORS = {
          dark: "#161616",
          light: "#f8f8f8",
        };

        const normalizeResolvedTheme = (theme) => {
          if (theme === "dark") return "dark";
          if (theme === "light") return "light";
          if (theme === "zai-dark") return "dark";
          if (theme === "zai-light") return "light";
          return theme;
        };

        const syncBrowserThemeSurface = (theme) => {
          document.documentElement.setAttribute("data-acode-browser-theme-surface", theme);
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", BROWSER_THEME_COLORS[theme]);
          document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", theme);
        };

        try {
          const saved = localStorage.getItem(STORAGE_KEY) || DEFAULT_THEME;
          const resolved =
            saved === "system"
              ? window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : normalizeResolvedTheme(saved);
          const finalTheme = resolved === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-acode-bootstrap-theme", finalTheme);
          syncBrowserThemeSurface(finalTheme);
          if (finalTheme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch {
          document.documentElement.setAttribute("data-acode-bootstrap-theme", "dark");
          syncBrowserThemeSurface("dark");
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--acode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--acode-bootstrap-fg, var(--color-foreground, #e2e8f0));
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      html[data-acode-bootstrap-theme="light"] body {
        background: var(--acode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--acode-bootstrap-fg, var(--color-foreground, #334155));
      }

      html[data-acode-browser-theme-surface],
      html[data-acode-browser-theme-surface] body,
      html[data-acode-browser-theme-surface] #root {
        /* 共享 UI 样式为 Electron vibrancy 强制透明根背景；浏览器入口必须用语义背景
           覆盖该桌面专属行为，否则浏览器工具栏、overscroll 和页面画布会回退为系统白色。 */
        background: var(--color-background, var(--acode-bootstrap-bg, #161616)) !important;
      }

      html[data-acode-browser-theme-surface="light"],
      html[data-acode-browser-theme-surface="light"] body,
      html[data-acode-browser-theme-surface="light"] #root {
        background: var(--color-background, var(--acode-bootstrap-bg, #f8f8f8)) !important;
      }

      .acode-boot-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        /* UI 全局样式会把 body/#root 置为透明，预渲染壳必须自己承接主题背景，否则深色主题会露出浏览器白底。*/
        background: var(--acode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--acode-bootstrap-fg, var(--color-foreground, #e2e8f0));
      }

      html[data-acode-bootstrap-theme="light"] .acode-boot-loading {
        background: var(--acode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--acode-bootstrap-fg, var(--color-foreground, #334155));
      }

      .acode-boot-loading__logo-shell {
        position: relative;
        display: flex;
        width: 96px;
        height: 96px;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: linear-gradient(180deg, #000000 0%, #151718 100%);
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.2),
          0 8px 10px -6px rgb(0 0 0 / 0.2);
      }

      .acode-boot-loading__logo-shell::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        /* 启动 logo 壳是固定深色底，边框不能跟随浅色主题 token，否则首屏边框过重。*/
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: inherit;
      }

      .acode-boot-loading__logo {
        width: 56px;
        height: auto;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 远程控制跨 workspace 时会整页跳转；在 JS 入口执行前先给出 loading 壳，避免出现白屏空档。-->
      <div
        class="acode-boot-loading"
        role="status"
        aria-live="polite"
        aria-busy="true"
        aria-label="Loading..."
      >
        <div class="acode-boot-loading__logo-shell">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="140px"
            height="137px"
            fill="none"
            viewBox="156 162 712 700"
            class="acode-boot-loading__logo"
            aria-hidden="true"
          >
            <defs>
              <linearGradient
                id="acode-brand-gradient"
                x1="238"
                y1="244"
                x2="542"
                y2="780"
                gradientUnits="userSpaceOnUse"
              >
                <stop offset="0" stop-color="#f1f5f9" />
                <stop offset="1" stop-color="#64748b" />
              </linearGradient>
            </defs>
            <path
              d="M238 244L542 512L238 780"
              fill="none"
              stroke="url(#acode-brand-gradient)"
              stroke-width="164"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <animate
                attributeName="opacity"
                dur="1.5s"
                repeatCount="indefinite"
                values="1;0.3;1"
              />
            </path>
            <rect x="668" y="412" width="200" height="200" rx="44" fill="#f8fafc">
              <animate
                attributeName="opacity"
                begin="0.75s"
                dur="1.5s"
                repeatCount="indefinite"
                values="1;0.3;1"
              />
            </rect>
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
